<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mexico-City · Meine Karte</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --lake:#9c1f56;        /* Rosa Mexicano dunkel (CDMX-Pink) */
    --lake-dark:#64123a;
    --paper:#fbf8f2;
    --ink:#20242a;
    --must:#c8472e;        /* Signalrot, Must-see */
    --kayak:#0e7c86;       /* Wasser-Petrol */
    --bar:#b07c10;         /* Cantina-Bernstein */
    --mus:#6b5b95;         /* Museums-Violett */
    --alt:#c2417f;         /* Alternativ-Magenta */
    --rnd:#4a7c59;         /* Random-Grün */
    --des:#46628c;         /* Architektur-Stahlblau */
    --radius:16px;
    --shadow:0 6px 24px rgba(100,18,58,.18);
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--paper);
  }
  #map{position:fixed;inset:0;z-index:1;background:#e9e2d8}

  /* ---------- Header ---------- */
  header{
    position:fixed;top:0;left:0;right:0;z-index:20;
    padding:calc(var(--sat) + 10px) 14px 0;
    pointer-events:none;
  }
  /* Filter chips: umbrechen statt scrollen, keine Titel-Karte mehr */
  .chips{
    pointer-events:auto;
    display:flex;flex-wrap:wrap;gap:7px;
    padding-bottom:4px;
  }
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    border:none;border-radius:999px;
    padding:8px 12px;font-size:.8rem;font-weight:600;
    background:#fff;color:var(--ink);
    box-shadow:0 2px 10px rgba(100,18,58,.14);
    cursor:pointer;transition:transform .12s ease,opacity .15s ease;
  }
  .chip:active{transform:scale(.95)}
  .chip .dot{width:10px;height:10px;border-radius:50%}
  .chip[data-cat="must"] .dot{background:var(--must)}
  .chip[data-cat="kayak"] .dot{background:var(--kayak)}
  .chip[data-cat="bar"] .dot{background:var(--bar)}
  .chip[data-cat="mus"] .dot{background:var(--mus)}
  .chip[data-cat="alt"] .dot{background:var(--alt)}
  .chip[data-cat="rnd"] .dot{background:var(--rnd)}
  .chip[data-cat="des"] .dot{background:var(--des)}
  .chip[data-cat="all"] .dot{background:conic-gradient(var(--must) 0 14.3%,var(--kayak) 14.3% 28.6%,var(--bar) 28.6% 42.9%,var(--mus) 42.9% 57.1%,var(--alt) 57.1% 71.4%,var(--rnd) 71.4% 85.7%,var(--des) 85.7% 100%)}
  .chip.off{opacity:.45}
  .chip.off .dot{background:#9aa3ab !important}
  .chip.safety.on{background:#b3261e;color:#fff}

  /* ---------- Sicherheits-Legende ---------- */
  .sec-legend{
    position:fixed;left:14px;bottom:calc(var(--sab) + 24px);z-index:15;
    background:#fff;border-radius:14px;box-shadow:var(--shadow);
    padding:12px 14px;width:218px;display:none;
  }
  .sec-legend.show{display:block}
  .sec-legend h3{font-size:.8rem;font-weight:800;margin-bottom:8px}
  .sec-metrics{display:flex;gap:6px;margin-bottom:10px}
  .sec-metrics button{
    flex:1;border:1px solid #d5dade;background:#fff;color:var(--ink);
    border-radius:8px;padding:6px 4px;font-size:.68rem;font-weight:700;cursor:pointer;
  }
  .sec-metrics button.on{background:#b3261e;border-color:#b3261e;color:#fff}
  .sec-scale{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-bottom:3px}
  .sec-scale span{flex:1}
  .sec-scale-lbl{display:flex;justify-content:space-between;font-size:.62rem;color:#79828a;margin-bottom:8px}
  .sec-legend .src{font-size:.62rem;line-height:1.45;color:#79828a}
  .sec-legend .src a{color:var(--lake)}

  /* ---------- Marker ---------- */
  .pin{
    display:flex;align-items:center;justify-content:center;
    width:38px;height:38px;border-radius:50% 50% 50% 6px;
    transform:rotate(0deg);
    font-size:19px;line-height:1;
    border:2.5px solid #fff;
    box-shadow:0 3px 10px rgba(100,18,58,.35);
  }
  .pin.must{background:var(--must)}
  .pin.kayak{background:var(--kayak)}
  .pin.bar{background:var(--bar)}
  .pin.mus{background:var(--mus)}
  .pin.alt{background:var(--alt)}
  .pin.rnd{background:var(--rnd)}
  .pin.des{background:var(--des)}
  .pin.own{background:#546e7a}

  /* ---------- Bottom Sheet ---------- */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -8px 32px rgba(100,18,58,.22);
    padding:10px 20px calc(var(--sab) + 20px);
    transform:translateY(110%);
    transition:transform .28s cubic-bezier(.32,.72,.3,1);
    max-height:55vh;overflow-y:auto;
  }
  .sheet.open{transform:translateY(0)}
  .grabber{width:40px;height:4px;border-radius:2px;background:#d5dade;margin:0 auto 12px}
  .sheet .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px;
  }
  .sheet .tag.must{background:var(--must)}
  .sheet .tag.kayak{background:var(--kayak)}
  .sheet .tag.bar{background:var(--bar)}
  .sheet .tag.mus{background:var(--mus)}
  .sheet .tag.alt{background:var(--alt)}
  .sheet .tag.rnd{background:var(--rnd)}
  .sheet .tag.des{background:var(--des)}
  .sheet .tag.own{background:#546e7a}
  .sheet h2{font-size:1.25rem;font-weight:800;line-height:1.25;margin-bottom:6px}
  .sheet .note{font-size:.92rem;line-height:1.55;color:#454c53}
  .sheet .meta{font-size:.8rem;color:#79828a;margin-top:10px}
  .sheet a.route{
    display:inline-block;margin-top:14px;
    background:var(--lake);color:#fff;text-decoration:none;
    font-size:.88rem;font-weight:700;
    padding:11px 18px;border-radius:12px;
  }
  .sheet a.route:active{background:var(--lake-dark)}
  .sheet a.web{background:#fff;color:var(--lake);border:1.5px solid var(--lake);margin-left:8px}
  .sheet a.del{background:#fff;color:#b3261e;border:1.5px solid #b3261e;margin-left:8px;cursor:pointer}

  /* ---------- Eigener Standort ---------- */
  .me-dot{
    width:18px;height:18px;border-radius:50%;
    background:#1a73e8;border:3px solid #fff;
    box-shadow:0 0 0 2px rgba(26,115,232,.35),0 2px 8px rgba(100,18,58,.3);
  }
  .me-rose{position:relative;width:48px;height:48px}
  .me-rose .me-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .me-beam{
    position:absolute;inset:0;border-radius:50%;display:none;
    background:conic-gradient(from -26deg, rgba(26,115,232,.4) 0 52deg, transparent 52deg);
  }
  .me-pulse{animation:pulse 2s ease-out infinite}
  @keyframes pulse{
    0%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 0 rgba(26,115,232,.45)}
    70%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 18px rgba(26,115,232,0)}
    100%{box-shadow:0 0 0 2px rgba(26,115,232,.35),0 0 0 0 rgba(26,115,232,0)}
  }
  @media (prefers-reduced-motion:reduce){.me-pulse{animation:none}}
  .locate-btn{
    position:fixed;right:14px;bottom:calc(var(--sab) + 24px);z-index:25;
    width:52px;height:52px;border-radius:50%;border:none;
    background:#fff;color:var(--lake);font-size:22px;
    box-shadow:var(--shadow);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease;
  }
  .locate-btn:active{transform:scale(.92)}
  .locate-btn.active{background:var(--lake);color:#fff}

  /* Leaflet Bedienelemente unter die (bis zu 3 Zeilen) Chips schieben */
  .leaflet-top{top:calc(var(--sat) + 130px)}
  .leaflet-control-attribution{font-size:9px}

  /* ---------- Desktop-Anpassung (mobile first, dann hoch) ---------- */
  @media (min-width:760px){
    header{left:20px;right:auto;width:380px}
    .sheet{left:20px;right:auto;width:380px;border-radius:22px;bottom:20px;max-height:50vh}
    .leaflet-top{top:20px}
    .leaflet-left{left:auto;right:10px}
    .sec-legend{left:auto;right:80px;bottom:20px}
  }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="chips" id="chips">
    <button class="chip" data-cat="all"><span class="dot"></span>Alle</button>
    <button class="chip" data-cat="must"><span class="dot"></span>⭐ Must-sees</button>
    <button class="chip" data-cat="kayak"><span class="dot"></span>🛶 Kajak</button>
    <button class="chip" data-cat="bar"><span class="dot"></span>🍸 Cantinas</button>
    <button class="chip" data-cat="mus"><span class="dot"></span>🖼️ Museen</button>
    <button class="chip" data-cat="alt"><span class="dot"></span>🎨 Alternativ</button>
    <button class="chip" data-cat="rnd"><span class="dot"></span>🎲 Random</button>
    <button class="chip" data-cat="des"><span class="dot"></span>📐 Design</button>
    <button class="chip safety" data-cat="safety" id="safetyChip">🚨 Sicherheit</button>
  </div>
</header>

<div class="sec-legend" id="secLegend">
  <h3>Sicherheit nach Polizeisektor</h3>
  <div class="sec-metrics">
    <button id="secMetH" class="on">Tötungsdelikte</button>
    <button id="secMetR">Strassenraub</button>
  </div>
  <div class="sec-scale" id="secScale"></div>
  <div class="sec-scale-lbl"><span>0</span><span>Rate pro 100’000/Jahr</span><span id="secHi"></span></div>
  <p class="src">Jun 2025 - Mai 2026 · Daten: <a href="https://hoyodecrimen.com/en/sectores-map/" target="_blank" rel="noopener">hoyodecrimen.com</a> (Open Data CDMX). Zentrumssektoren mit wenig Wohnbevölkerung erscheinen überzeichnet. Sektor antippen für Details.</p>
</div>

<button class="locate-btn" id="locateBtn" aria-label="Meinen Standort anzeigen" title="Mein Standort">➤</button>

<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <span class="tag" id="sheetTag"></span>
  <h2 id="sheetTitle"></h2>
  <p class="note" id="sheetNote"></p>
  <p class="meta" id="sheetMeta"></p>
  <a class="route" id="sheetRoute" target="_blank" rel="noopener">Route in Google Maps</a>
  <a class="route web" id="sheetWeb" target="_blank" rel="noopener">Website</a>
  <a class="route del" id="sheetDel" role="button">Pin löschen</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CATS = {
  must:  {label:"Must-see",     emoji:"⭐"},
  kayak: {label:"Kajak",        emoji:"🛶"},
  bar:   {label:"Bar & Cantina", emoji:"🍸"},
  mus:   {label:"Museum",       emoji:"🖼️"},
  alt:   {label:"Alternativ",   emoji:"🎨"},
  rnd:   {label:"Random Sight", emoji:"🎲"},
  des:   {label:"Design & Architektur", emoji:"📐"},
  own:   {label:"Eigener Pin", emoji:"📍"}
};

const PLACES = [
  // ---------- Must-sees ----------
  {cat:"must", name:"Zócalo & Kathedrale", lat:19.432647, lng:-99.133199,
   note:"Die Plaza de la Constitución, kurz Zócalo, ist einer der grössten Plätze der Welt und seit aztekischer Zeit das Machtzentrum des Landes. An der Nordseite steht die gewaltige Kathedrale, ab 1573 teils aus Steinen zerstörter Aztekentempel errichtet, die im weichen Seeboden langsam und ungleichmässig absinkt. Drumherum stehen Paläste aus rotem Tezontle-Vulkanstein, darunter der Palacio Nacional und das alte Stadthaus. Früh am Morgen ist der Platz fast leer, dann lassen sich Kathedrale und Fassaden in Ruhe anschauen.",
   meta:"Centro Histórico · Platz frei zugänglich · Kathedrale täglich, gratis", url:"https://catedralmetropolitana.mx/"},
  {cat:"must", name:"Templo Mayor", lat:19.435062, lng:-99.131432,
   note:"Der Haupttempel der Azteken lag jahrhundertelang vergessen unter dem Kolonialzentrum, bis Elektriker 1978 zufällig den monumentalen Stein der Mondgöttin Coyolxauhqui fanden. Für die Ausgrabung direkt neben der Kathedrale wurden ganze Häuserblöcke abgetragen, sichtbar sind die übereinander gebauten Bauphasen des Tempels. Das Museum am Ende des Rundgangs zeigt die Funde, neben dem Coyolxauhqui-Stein auch die riesige Steinplatte der Erdgöttin Tlaltecuhtli. Ein Teil der Ruinen ist gratis vom Trottoir aus einsehbar, der Eingang zum Rundgang liegt an der Calle Seminario 8.",
   meta:"Seminario 8, Centro Histórico · Di bis So 9 bis 17 Uhr · M$ 210", url:"https://www.templomayor.inah.gob.mx/"},
  {cat:"must", name:"Palacio de Bellas Artes", lat:19.435501, lng:-99.141259,
   note:"Der Marmorpalast wurde 1904 unter Porfirio Díaz begonnen und wegen Revolution und absinkendem Untergrund erst 1934 vollendet, daher die Mischung aus Jugendstil-Fassade und Art-déco-Innenleben. Das Museum in den oberen Stockwerken zeigt die Wandbilder von Rivera, Orozco und Siqueiros, darunter Riveras Neufassung des im Rockefeller Center zerstörten Werks. Im Theatersaal hängt ein Bühnenvorhang aus fast einer Million Tiffany-Glasstücken, zu sehen bei Aufführungen des Ballet Folklórico. Bester Blick auf die orange Kuppel vom Café im 8. Stock des Sears-Hauses gegenüber, sonntags ist das Museum gratis.",
   meta:"Av. Juárez y Eje Central, Centro Histórico · Museum Di bis So 10 bis 18 Uhr · M$ 90, So gratis", url:"https://palacio.inba.gob.mx/"},
  {cat:"must", name:"Chapultepec & Castillo", lat:19.420463, lng:-99.182087,
   note:"Der Bosque de Chapultepec ist rund doppelt so gross wie der Central Park, mit Seen, Zoo und mehreren grossen Museen. Auf dem Hügel steht das einzige echte Schloss Nordamerikas, im 18. Jahrhundert als Vizekönigsresidenz begonnen, ab 1864 Sitz von Kaiser Maximilian von Habsburg. Heute beherbergt es das Nationale Geschichtsmuseum, von den Terrassen reicht der Rundblick den ganzen Paseo de la Reforma entlang. Am Wochenende ist der Park sehr voll, für das Castillo darum am besten werktags gleich zur Öffnung um 9 Uhr hinauf.",
   meta:"Bosque de Chapultepec, 1. Sektion · Park Di bis So, gratis · Castillo Di bis So 9 bis 17 Uhr, M$ 210", url:"https://mnh.inah.gob.mx/"},
  {cat:"must", name:"Museo Nacional de Antropología", lat:19.426152, lng:-99.186652,
   note:"Der Bau von Pedro Ramírez Vázquez aus dem Jahr 1964 gilt als eines der grossen Museen der Welt, im Erdgeschoss Archäologie, oben Ethnografie. Wahrzeichen ist der Beton-Schirm im Innenhof, ein riesiges Dach, das frei schwebend auf einer einzigen wasserumspülten Säule ruht. Im Mexica-Saal stehen der aztekische Sonnenstein und die Coatlicue-Statue, im Maya-Saal liegen die Jade-Grabschätze des Königs Pakal aus Palenque. Für die Highlights einen halben Tag einplanen und werktags früh kommen, am Sonntag ist der Andrang wegen des Gratis-Eintritts für Einheimische am grössten.",
   meta:"Paseo de la Reforma, Bosque de Chapultepec · Di bis So 9 bis 18 Uhr · M$ 210", url:"https://mna.inah.gob.mx/"},
  {cat:"must", name:"Xochimilco (Trajineras)", lat:19.252056, lng:-99.093350,
   note:"Die Kanäle von Xochimilco sind der letzte Rest des aztekischen Chinampa-Systems schwimmender Gärten, auf denen Gemüse und Blumen für Tenochtitlan wuchsen, seit 1987 UNESCO-Welterbe. Auf bunt bemalten Trajineras wird man durch die Kanäle gestakt, vorbei an Booten mit Mariachi-Kapellen, Garküchen und Blumenhändlern. Am Wochenende ist das eine schwimmende Party, unter der Woche fast still. Nur an offiziellen Embarcaderos wie Nuevo Nativitas mieten, der offizielle Tarif gilt pro Boot und Stunde, nicht pro Person.",
   meta:"Embarcadero Nuevo Nativitas, Xochimilco · täglich · Boot ca. M$ 750 pro Stunde", url:"https://de.wikipedia.org/wiki/Xochimilco"},
  {cat:"must", name:"Teotihuacán", lat:19.692500, lng:-98.843900,
   note:"Teotihuacán war um das Jahr 400 mit über 100'000 Einwohnern eine der grössten Städte der Welt und entstand lange vor den Azteken, die der verlassenen Anlage ihren Namen gaben, „Ort, wo man zum Gott wird“. An der Strasse der Toten reihen sich Sonnen- und Mondpyramide, die Zitadelle mit dem Quetzalcoatl-Tempel und Wohnkomplexe mit Wandmalereien. Das Besteigen der Pyramiden ist seit 2021 gesperrt, die Dimensionen beeindrucken auch vom Boden aus. Früh hinfahren wegen Hitze und Reisebussen, Busse ab Terminal Norte fahren alle 20 Minuten und brauchen rund eine Stunde.",
   meta:"50 km nordöstlich, San Juan Teotihuacán · täglich 8 bis 17 Uhr · M$ 210", url:"https://www.teotihuacan.inah.gob.mx/"},
  {cat:"must", name:"Coyoacán", lat:19.349261, lng:-99.163669,
   note:"Coyoacán war ein eigenständiges Dorf, in dem Hernán Cortés nach dem Fall von Tenochtitlan seinen ersten Regierungssitz einrichtete, erst im 20. Jahrhundert wuchs die Stadt darum herum. Um die Plätze Jardín Centenario und Jardín Hidalgo liegen Kopfsteinpflastergassen, Kaffeehäuser und die Klosterkirche San Juan Bautista aus dem 16. Jahrhundert. Im Mercado de Coyoacán sind die Tostada-Stände berühmt. Gut mit der Casa Azul von Frida Kahlo kombinierbar, deren Tickets unbedingt vorab online kaufen.",
   meta:"Jardín Centenario, Coyoacán · frei zugänglich · Markt täglich", url:"https://www.coyoacan.cdmx.gob.mx/"},
  {cat:"must", name:"Basílica de Guadalupe", lat:19.484858, lng:-99.117857,
   note:"Hier soll die Jungfrau von Guadalupe 1531 dem Indigenen Juan Diego erschienen sein, sein Umhang mit dem Gnadenbild macht den Ort zum wichtigsten Wallfahrtsziel Amerikas mit rund 20 Millionen Pilgern pro Jahr. Die alte Basilika aus dem 18. Jahrhundert sinkt sichtbar schief in den weichen Boden, daneben steht der riesige Rundbau von 1976 mit Platz für rund 10'000 Menschen. Am Gnadenbild hinter dem Altar fährt ein Laufband vorbei, damit niemand stehen bleibt. Rund um den 12. Dezember, den Guadalupe-Tag, ist das Gelände überfüllt, am ruhigsten ist ein Besuch werktags am Morgen.",
   meta:"Villa de Guadalupe, Gustavo A. Madero · täglich 6 bis 21 Uhr · gratis", url:"https://virgendeguadalupe.org.mx/"},
  {cat:"must", name:"Palacio Nacional", lat:19.432554, lng:-99.131267,
   note:"Der Regierungspalast füllt die ganze Ostseite des Zócalo und steht an der Stelle des Palasts von Moctezuma, dessen Steine Cortés für den Neubau wiederverwenden liess. Über dem Haupttreppenhaus malte Diego Rivera von 1929 bis 1935 sein Wandbild-Epos zur Geschichte Mexikos, im Obergeschoss folgen weitere Fresken zum Leben vor der Eroberung. Seit 2018 ist der Palast auch Wohnsitz der Präsidentschaft, zugänglich sind der Haupthof mit den Muralen und die Gärten. Eintritt frei, aber offiziellen Ausweis oder Pass mitnehmen und Wartezeit am Eingang an der Calle Moneda einrechnen.",
   meta:"Zócalo, Eingang Calle Moneda · Di bis So 9 bis 17 Uhr · gratis, Ausweis nötig", url:"https://sic.cultura.gob.mx/ficha.php?table=museo&table_id=2360"},

  // ---------- Kajak ----------
  {cat:"kayak", name:"Embarcadero Cuemanco (Kajak)", lat:19.289158, lng:-99.101753,
   note:"Der ruhige Zugang nach Xochimilco: Kajak- und Kanuverleih abseits des Trajinera-Trubels, direkt neben der Olympia-Regattastrecke von 1968. Durch stille Kanäle zwischen Chinampa-Feldern paddeln, mit etwas Glück Reiher und Eisvögel. Die Kanäle sind der letzte Rest des aztekischen Seen- und Chinampa-Systems, seit 1987 Unesco-Welterbe. Geführte 3-Stunden-Touren kosten rund M$ 500 pro Person, am schönsten ist die Sonnenaufgangs-Tour, lange bevor die Trajineras auslaufen.",
   meta:"Periférico Sur, Cuemanco · Touren ab Sonnenaufgang, je 3 Std · geführte Tour M$ 500 p. P.", url:"https://www.kayakingxochimilco.com/"},
  {cat:"kayak", name:"Pista Olímpica Virgilio Uribe", lat:19.282355, lng:-99.104547,
   note:"Die Ruder- und Kanustrecke der Olympischen Spiele 1968: ein rund 2 km langes, schnurgerades Wasserband am Periférico Sur. Gebaut nach Beratung durch den Schweizer Ruderverbands-Präsidenten Thomas Keller, gespeist aus Tiefbrunnen des alten Xochimilco-Sees, benannt nach dem 1914 in Veracruz gefallenen Marinekadetten Virgilio Uribe. Heute trainieren hier Ruder- und Kanuclubs sowie Nationalteams, am Rand verlaufen Lauf- und Velowege. Früh am Morgen lohnt der Abstecher vom Embarcadero nebenan, dann ziehen Achter und Canadier bei glattem Wasser ihre Bahnen.",
   meta:"Periférico Sur, neben Embarcadero Cuemanco · Mo-Fr 8-19 Uhr, Sa/So ab 7 Uhr", url:"https://indeporte.cdmx.gob.mx/instalaciones/pista-olimpica-de-remo-y-canotaje"},
  {cat:"kayak", name:"Isla de las Muñecas", lat:19.272245, lng:-99.088708,
   note:"Die berüchtigte Puppeninsel tief in den Kanälen: hunderte verwitterte Puppen, die der Einsiedler Julián Santana ab 1951 aufhängte, um den Geist eines ertrunkenen Mädchens zu besänftigen. 2001 ertrank er selbst an derselben Stelle, seither zeigt seine Familie die Insel gegen einen kleinen Eintritt. Nur per Boot oder Kajak erreichbar, ab Cuemanco gut 2 Stunden pro Weg durch zunehmend stille Kanäle. Früh starten, Wasser und Sonnenschutz einpacken und beim Verleih ausdrücklich die Original-Insel verlangen, nahe der Embarcaderos liegen nachgebaute Puppeninseln für Schnelltouren.",
   meta:"Tief in den Kanälen, nur per Boot oder Kajak · Tagestour ab Cuemanco, gut 2 Std pro Weg · kleiner Eintritt vor Ort", url:"https://de.wikipedia.org/wiki/Isla_de_las_Mu%C3%B1ecas"},
  {cat:"kayak", name:"Parque Ecológico de Xochimilco", lat:19.293688, lng:-99.096242,
   note:"Feuchtgebiet-Schutzzone mit Lagunen, Chinampas und Vogelbeobachtung, hier laufen die Zuchtprojekte für den Axolotl. Der rund 150 Hektaren grosse Park wurde 1993 im Zuge des Xochimilco-Rettungsplans angelegt, rund ein Viertel ist Wasserfläche. Der stille Gegenpol zum Partyteil von Xochimilco: über 50 Zugvogelarten rasten hier, im Winterhalbjahr auch Ibisse und Pelikane. Eintritt frei, Fernglas mitnehmen, und der Besuch lässt sich gut mit einer Paddeltour ab dem nahen Cuemanco kombinieren.",
   meta:"Periférico Oriente 1, Ciénega Grande · Di-So geöffnet · Eintritt frei", url:"https://mexicocity.cdmx.gob.mx/venues/xochimilco-ecological-park/"},
  {cat:"kayak", name:"Valle de Bravo", lat:19.201123, lng:-100.131536,
   note:"Bergsee-Städtchen auf gut 1800 m und klassisches Wochenendziel: Kajak, Segeln und SUP auf dem Stausee, drumherum Pinienwälder und Gleitschirme. Der See ist die 1947 vollendete Presa Miguel Alemán, seit 2005 trägt der Ort das Label Pueblo Mágico und gilt als eine der Gleitschirm-Hochburgen weltweit. Von November bis März überwintern in den Bergwäldern der Umgebung Monarchfalter, ein lohnender Zusatzstopp. Morgens liegt der See meist ruhig, gegen Mittag setzt verlässlich der Thermikwind ein, der die Segler freut, fürs Paddeln also früh raus; als Tagesausflug machbar, mit Übernachtung besser.",
   meta:"Gut 2 Std westlich von CDMX (ca. 150 km) · ganzjährig, Monarchfalter Nov-März · Pueblo Mágico", url:"https://www.sectur.gob.mx/gobmx/pueblos-magicos/valle-de-bravo-mexico/"},

  // ---------- Bars & Cantinas ----------
  {cat:"bar", name:"Handshake Speakeasy", lat:19.425700, lng:-99.165345,
   note:"Verstecktes Art-déco-Lokal in der Colonia Juárez, 2024 zur besten Bar der Welt gekürt und 2025 auf Platz 2 der „World's 50 Best Bars“. Das Team um Eric van Beek entwickelt seine präzisen, fast wissenschaftlichen Cocktails im hauseigenen Labor, bekannt sind die geklärte Piña Colada und der Fig Martini. Der Hauptraum fasst nur rund 32 Gäste pro 90-Minuten-Slot, ohne Reservation ist man chancenlos. Tische werden über OpenTable vergeben und sind oft Wochen im Voraus weg, am ehesten klappt es unter der Woche früh am Abend.",
   meta:"Amberes 65, Juárez · abends, Slots à 90 Minuten · Reservation über OpenTable zwingend, früh buchen", url:"https://handshake.bar"},
  {cat:"bar", name:"Licorería Limantour", lat:19.418150, lng:-99.159526,
   note:"Seit der Eröffnung 2011 gilt das Lokal als die Bar, die Mexikos moderne Cocktailszene begründet hat, seit Jahren steht sie in den Welt-Top-Ten. Das zweistöckige Haus an der Álvaro Obregón ist lauter und zugänglicher als Handshake, das Publikum entsprechend gemischter. Klassiker ist der Margarita al Pastor mit Ananas, Koriander und Chili, der die Aromen des Taco al Pastor ins Glas holt. Unter der Woche öffnet die Bar um 18 Uhr, Freitag bis Sonntag schon um 15 Uhr, für den Abend lohnt sich die Reservation über OpenTable.",
   meta:"Álvaro Obregón 106, Roma Norte · Mo-Do 18-24 Uhr, Fr/Sa 15-2 Uhr, So 15-24 Uhr · Reservation empfohlen", url:"https://limantour.tv"},
  {cat:"bar", name:"Cantina La Ópera", lat:19.434725, lng:-99.139331,
   note:"Prunk-Cantina von 1876, seit 1895 an der heutigen Adresse, mit vergoldeter Barockdecke, dunklem Nussbaumholz und einer aus New Orleans importierten Bartheke. Oben im Plafond steckt angeblich noch das Einschussloch, das Pancho Villa beim Einzug seiner Truppen 1914 hinterliess. Die Karte mischt spanische und mexikanische Cantina-Klassiker, mittags isst man hier am besten und bekommt eher eines der holzvertäfelten Séparées. Geöffnet Montag bis Samstag von 13 bis 24 Uhr, sonntags nur bis 18 Uhr, Gruppen reservieren telefonisch.",
   meta:"5 de Mayo 10, Centro · Mo-Sa 13-24 Uhr, So 13-18 Uhr · Küche mittags am besten", url:"https://www.barlaopera.com"},
  {cat:"bar", name:"Salón Tenampa", lat:19.441034, lng:-99.138961,
   note:"Seit 1925 die Mutter aller Mariachi-Cantinas an der Plaza Garibaldi, gegründet im selben Jahr, in dem die ersten Mariachi-Kapellen am Platz ankamen. Innen Wandbilder der grossen Ranchera-Legenden, Tequila im Caballito und Kapellen, die gegen Bezahlung direkt am Tisch aufspielen. Lieder werden pro Stück mit den Musikern abgemacht, darum genügend Bargeld mitnehmen. Täglich ab 13 Uhr geöffnet, Donnerstag bis Samstag bis 3 Uhr morgens, für den Rückweg besser Uber oder Taxi statt Fussmarsch.",
   meta:"Plaza Garibaldi 12, Centro · tägl. 13-2 Uhr, Do-Sa bis 3 Uhr · abends am stimmungsvollsten, Rückweg per Taxi/Uber", url:"https://tenampa.com.mx"},
  {cat:"bar", name:"Bósforo Mezcalería", lat:19.433000, lng:-99.144900,
   note:"Halbdunkle, winzige Mezcal-Bar hinter einer unscheinbaren Tür an der Luis Moya, seit Jahren eine Institution für seltene Dorf-Mezcales aus Oaxaca und anderen Regionen. Statt Cocktail-Schnickschnack gibt es puren Mezcal, dazu Orangenschnitze mit Gewürzsalz, Vinyl-Musik und Kerzenlicht. Reservieren kann man nicht, der schmale Raum füllt sich schnell, also früh am Abend kommen oder Wartezeit einplanen. Sonntag und Montag bleibt die Tür zu, an den übrigen Tagen läuft die Bar vom späteren Nachmittag bis tief in die Nacht.",
   meta:"Luis Moya 31, Centro · Di-Sa abends bis spät, So/Mo geschlossen · keine Reservation, früh kommen", url:"https://www.facebook.com/pages/B%C3%B3sforo-Mezcaleria/280170022102134"},
  {cat:"bar", name:"Pulquería Los Insurgentes", lat:19.419367, lng:-99.164043,
   note:"Pulque, das vergorene Agavengetränk aus vorspanischer Zeit, hier in jungem Gewand: mehrere Stockwerke voller Wandbilder bis hinauf zur Dachterrasse, abends oft Live-Musik oder DJs. Die Curados gibt es in Geschmacksrichtungen von Hafer über Guave bis Sellerie, das Publikum ist jung und lokal. Zum Einstieg lohnt sich ein kleiner Becher Pulque natur, danach versteht man die Frucht-Varianten besser. Täglich ab dem frühen Nachmittag bis gegen 2 Uhr geöffnet, ohne Reservation, an Wochenenden wird es ab dem späteren Abend voll.",
   meta:"Insurgentes Sur 226, Roma Norte · tägl. ab ca. 14 Uhr bis 1-2 Uhr nachts · keine Reservation nötig", url:"https://www.facebook.com/pulqueriainsurgentes/"},

  // ---------- Museen ----------
  {cat:"mus", name:"Museo Frida Kahlo (Casa Azul)", lat:19.355141, lng:-99.162356,
   note:"Fridas kobaltblaues Geburts- und Sterbehaus in Coyoacán zeigt Atelier, Küche, Korsette, Kleider und den bepflanzten Innenhof fast unverändert. Diego Rivera übergab das Haus nach ihrem Tod dem Staat, seit 1958 ist es Museum und heute eines der meistbesuchten der Stadt. Zu sehen sind auch späte Werke wie „Viva la Vida“ sowie ihre Sammlung von Volkskunst und Ex-Votos. Tickets gibt es ausschliesslich online und oft erst Wochen im Voraus, am entspanntesten ist der erste Slot am Morgen unter der Woche.",
   meta:"Londres 247, Coyoacán · Di bis So 10 bis 18 Uhr, Mi ab 11 Uhr · M$ 320, nur online", url:"https://www.museofridakahlo.org.mx/"},
  {cat:"mus", name:"Museo Jumex", lat:19.440553, lng:-99.203635,
   note:"Die Sammlung des Jumex-Erben Eugenio López Alonso gilt als wichtigste private Kollektion zeitgenössischer Kunst Lateinamerikas, mit Werken von Gabriel Orozco bis Jeff Koons. Der Bau mit dem markanten Sägezahndach von 2013 ist das erste Lateinamerika-Projekt von David Chipperfield. Der Eintritt ist inzwischen ganz gratis, ohne Reservation. Direkt gegenüber steht das silberne Soumaya, das Duo lässt sich gut an einem halben Tag kombinieren, samstags ist bis 19 Uhr geöffnet.",
   meta:"Miguel de Cervantes Saavedra 303, Nuevo Polanco · Di bis So 10 bis 17 Uhr, Sa bis 19 Uhr · gratis", url:"https://www.fundacionjumex.org/"},
  {cat:"mus", name:"Museo Tamayo", lat:19.425802, lng:-99.181710,
   note:"Rufino Tamayo schenkte Mexiko seine internationale Sammlung und liess dafür 1981 diesen preisgekrönten Betonbau von Teodoro González de León und Abraham Zabludovsky in den Chapultepec-Wald setzen. Heute zeigt das Haus vor allem wechselnde internationale Gegenwartskunst, dazu punktuell Werke der Gründungssammlung mit Picasso, Miró und Bacon. Das Museum ist klein genug für einen entspannten Besuch von gut einer Stunde. Sonntags ist der Eintritt gratis, dann aber deutlich voller, das Anthropologiemuseum liegt gleich gegenüber.",
   meta:"Paseo de la Reforma 51, Chapultepec · Di bis So 10 bis 18 Uhr · M$ 95, So gratis", url:"https://www.museotamayo.org/"},
  {cat:"mus", name:"Museo de Arte Moderno", lat:19.422990, lng:-99.179606,
   note:"Der Rundbau von Pedro Ramírez Vázquez (1964) versammelt die mexikanische Moderne, darunter Frida Kahlos „Die zwei Fridas“, Remedios Varo, Leonora Carrington und die grossen Muralisten. Dazu kommt der Skulpturengarten unter alten Bäumen, der allein schon den Umweg lohnt. Die Sammlung wird rotierend gezeigt, einzelne Ikonen sind gelegentlich ausgeliehen. Sonntags ist der Eintritt gratis, unter der Woche hat man die Säle ab 10:15 Uhr fast für sich.",
   meta:"Paseo de la Reforma, Ecke Gandhi, Chapultepec · Di bis So 10:15 bis 17:45 Uhr · M$ 95, So gratis", url:"https://mam.inba.gob.mx/"},
  {cat:"mus", name:"Museo Anahuacalli", lat:19.322579, lng:-99.144077,
   note:"Diego Rivera entwarf diesen Tempel aus schwarzem Vulkanstein zusammen mit Juan O’Gorman als Haus für seine rund 50000 präkolumbischen Figuren, von denen etwa 2000 ausgestellt sind. Eröffnet wurde der Bau auf dem Lavafeld erst 1964, sieben Jahre nach Riveras Tod. Das düstere, monumentale Haus ist viel zu wenig besucht und umfasst auch einen Atelierraum mit Skizzen für Riveras Murales sowie eine Terrasse mit Blick über den Süden der Stadt. Beim Online-Kauf des Casa-Azul-Tickets lässt sich der Eintritt kostenlos als Zusatz dazubuchen, die Kombination am selben Tag lohnt sich.",
   meta:"Museo 150, San Pablo Tepetlapa, Coyoacán · Di bis So 11 bis 17:30 Uhr · M$ 130, im Casa-Azul-Ticket inbegriffen", url:"https://museoanahuacalli.org.mx/"},
  {cat:"mus", name:"MUAC (UNAM)", lat:19.314781, lng:-99.185438,
   note:"Der schräge Glasbau von Teodoro González de León (2008) auf dem Unigelände sammelt mexikanische Gegenwartskunst ab 1952 und zeigt mutige Wechselausstellungen für ein junges Publikum. Der Campus selbst ist UNESCO-Welterbe, die Mosaikbibliothek von Juan O’Gorman liegt nur wenige Minuten entfernt. Donnerstags und samstags ist bis 20 Uhr geöffnet, am Donnerstagabend ab 18 Uhr sogar gratis. Sonntags kostet der Eintritt die Hälfte, die Anreise klappt am einfachsten mit dem Metrobús bis Centro Cultural Universitario.",
   meta:"Insurgentes Sur 3000, Ciudad Universitaria · Di bis So, Do und Sa bis 20 Uhr · M$ 60, So 50%, Do ab 18 Uhr gratis", url:"https://muac.unam.mx/"},
  {cat:"mus", name:"Museo Nacional de Arte (MUNAL)", lat:19.436458, lng:-99.139087,
   note:"Der ab 1904 von Silvio Contri als Kommunikationsministerium erbaute Palast zeigt mexikanische Kunst von der Kolonialzeit bis etwa 1950, von barocken Altarbildern über José María Velascos Landschaften bis zu den Muralisten. Allein das Treppenhaus aus Marmor und Bronze lohnt den Besuch. Davor steht auf der stillen Plaza Tolsá die Reiterstatue Karls IV., „El Caballito“ von Manuel Tolsá. Sonntags ist der Eintritt gratis, die ruhigen Säle sind ein gutes Schlechtwetterprogramm im Centro.",
   meta:"Tacuba 8, Centro · Di bis So 10 bis 18 Uhr · M$ 95, So gratis", url:"https://munal.mx/"},
  {cat:"mus", name:"Museo de Arte Popular", lat:19.433979, lng:-99.146260,
   note:"Volkskunst vom Feinsten in einem Art-déco-Feuerwehrhaus von 1928: Alebrijes, Textilien, Keramik und Lackarbeiten aus allen Regionen des Landes. Das 2006 eröffnete Haus organisiert auch die berühmte nächtliche Alebrije-Parade, deren Riesenfiguren jeweils im Herbst durchs Centro ziehen. Als Fundgrube für Techniken und Muster kaum zu überbieten, entsprechend ergiebig ist der Museumsshop mit Handwerk in Galeriequalität. Sonntags ist der Eintritt gratis, für den Rundgang reichen gut eineinhalb Stunden.",
   meta:"Revillagigedo 11, Centro · Di bis So 10 bis 18 Uhr · M$ 60, So gratis", url:"https://www.map.cdmx.gob.mx/"},
  {cat:"mus", name:"Museo Mural Diego Rivera", lat:19.436200, lng:-99.146809,
   note:"Ein Museum für ein einziges Wandbild: Riveras „Sonntagnachmittagstraum in der Alameda“ von 1947 mit hunderten Figuren der mexikanischen Geschichte, darunter Frida Kahlo und Posadas elegante Catrina. Das Fresko entstand für das Hotel del Prado und wurde nach dem Erdbeben von 1985 in einem spektakulären Transport hierher gerettet. Erklärtafeln schlüsseln die Figuren einzeln auf, eine gute halbe Stunde reicht für den Besuch. Sonntags gratis und ideal kombinierbar mit Alameda, Palacio de Bellas Artes und dem Franz Mayer gleich nebenan.",
   meta:"Balderas, Ecke Colón, an der Alameda · Di bis So 10 bis 18 Uhr · M$ 45, So gratis", url:"https://museomuraldiegorivera.inba.gob.mx/"},
  {cat:"mus", name:"Museo Franz Mayer", lat:19.437312, lng:-99.143183,
   note:"Die Sammlung des deutschstämmigen Financiers Franz Mayer versammelt angewandte Kunst und Design aus vier Jahrhunderten, Möbel, Keramik, Silber und Textilien, untergebracht im ehemaligen Hospital San Juan de Dios. Dazu kommen Wechselausstellungen zu Gestaltung und Fotografie, jedes Jahr macht hier auch die World Press Photo Station. Der stille Kreuzgang-Innenhof mit Café ist einer der schönsten Rückzugsorte im Centro. 2026 feiert das 1986 eröffnete Haus sein 40-Jahr-Jubiläum mit Sonderprogramm.",
   meta:"Av. Hidalgo 45, an der Alameda · Di bis So 10 bis 17 Uhr · M$ 130", url:"https://boletos.franzmayer.org.mx/"},

  // ---------- Alternativ ----------
  {cat:"alt", name:"Roma Norte", lat:19.421700, lng:-99.160572,
   note:"Das Quartier aus Alfonso Cuaróns Film „Roma“: Jugendstil-Villen, Galerien, Spezialitätenkaffee und Taco-Stände Tür an Tür. Angelegt wurde die Colonia Roma Anfang des 20. Jahrhunderts als grossbürgerliches Viertel, nach dem Erdbeben von 1985 verfiel sie und wurde später von Galeristen und Gastronomen wiederbelebt. Am dichtesten ist das Angebot rund um die Plaza Río de Janeiro mit ihrer David-Replik und entlang der Avenida Álvaro Obregón. Am besten zu Fuss erkunden, gegen Abend füllen sich Cafés, Bars und Taquerías.",
   meta:"Colonia Roma Norte, Cuauhtémoc · frei zugänglich · zu Fuss, gegen Abend am besten", url:"https://de.wikipedia.org/wiki/Colonia_Roma"},
  {cat:"alt", name:"Condesa & Parque México", lat:19.411859, lng:-99.169805,
   note:"Art-déco-Quartier um einen ovalen Park mit Hundewiesen, Buchläden und Bistros, der entspannteste Spaziergang der Stadt. Der Parque México wurde 1927 auf der ehemaligen Pferderennbahn des Jockey Club angelegt, daher die ovale Form und der Quartiername Hipódromo. Im Zentrum liegt das offene Art-déco-Theater Foro Lindbergh mit Pergolen und Brunnen. Für die grosse Runde lohnt sich die Avenida Ámsterdam, die frühere Trainingsbahn mit begrünter Mittelpromenade.",
   meta:"Colonia Hipódromo Condesa · Park täglich frei zugänglich", url:"https://es.wikipedia.org/wiki/Parque_M%C3%A9xico"},
  {cat:"alt", name:"Mercado Roma", lat:19.414124, lng:-99.164591,
   note:"Gourmet-Markthalle auf drei Etagen mit Ständen von Churros bis Ceviche, oben Biergarten auf der Dachterrasse. 2014 eröffnet, war sie die erste Gourmet-Markthalle der Stadt und ist der moderne Kontrast zu den klassischen Märkten. Im Erdgeschoss Delikatessen und Theken, im ersten Stock Restaurants und Bars. Mittags unter der Woche findet man am ehesten Platz, abends und am Wochenende wird es voll.",
   meta:"Querétaro 225, Roma Norte · täglich, Erdgeschoss ab 9 Uhr, Terrasse und Bars bis nachts", url:"https://mr.mercadoroma.com/"},
  {cat:"alt", name:"Bazar Sábado (San Ángel)", lat:19.344503, lng:-99.192318,
   note:"Samstags verwandelt sich das koloniale San Ángel in einen Kunsthandwerksmarkt, Maler auf der Plaza, Textilien und Silber in den Innenhöfen. Kern ist der Bazaar Sábado, seit 1960 in einem Stadtpalais aus dem 17. Jahrhundert an der Plaza San Jacinto 11, mit kuratiertem Kunsthandwerk und Design. Rund um die Plaza füllen weitere Stände und offene Ateliers die Gassen. Am besten vormittags kommen und den Besuch mit dem nahen Diego-Rivera-Atelierhaus verbinden.",
   meta:"Plaza San Jacinto 11, San Ángel · nur Samstag, ca. 10-19 Uhr", url:"https://www.elbazaarsabado.mx/"},
  {cat:"alt", name:"Tianguis Cultural del Chopo", lat:19.448763, lng:-99.149933,
   note:"Seit 1980 der Subkultur-Markt der Stadt, Punk, Goth und Metal, Vinyl, Patches und Live-Bands am Ende der Gasse. Entstanden als Musik-Tauschbörse am Museo Universitario del Chopo, ist er seit 2023 offiziell immaterielles Kulturerbe von Mexiko-Stadt, ein Unikum in Lateinamerika. Die Konzerte auf der kleinen Bühne nehmen gegen Nachmittag Fahrt auf. Anreise am einfachsten bis Station Buenavista (Metro Linie B und Metrobús), wenige Meter vom Eingang.",
   meta:"Calle Juan Aldama, Buenavista · nur Samstag, ca. 10-17 Uhr", url:"https://mexicocity.cdmx.gob.mx/venues/tianguis-cultural-del-chopo/"},
  {cat:"alt", name:"Cineteca Nacional", lat:19.360634, lng:-99.164840,
   note:"Das nationale Filmarchiv unter einem spektakulären weissen Dachgitter, mit Autorenkino in zehn Sälen, Open-Air-Vorführungen auf der Wiese und Buchhandlung. Der Umbau von Rojkind Arquitectos machte den Campus 2012 zum Treffpunkt, abends ist das Gelände schön belebt. Der Eintritt kostet rund 70 Pesos, dienstags und mittwochs nur 50. Programm vorab online prüfen, die meisten Filme laufen in Originalsprache mit spanischen Untertiteln.",
   meta:"Av. México-Coyoacán 389, Xoco · täglich · ca. 70 MXN, Di/Mi 50 MXN", url:"https://www.cinetecanacional.net/"},
  {cat:"alt", name:"Lucha Libre (Arena México)", lat:19.424614, lng:-99.152001,
   note:"Maskierte Luchadores, Flugeinlagen und ein tobendes Publikum mit Bier und Chips, die grosse Arena von 1956 gilt als „Catedral de la Lucha Libre“. Der Traditionsverband CMLL bespielt sie dreimal pro Woche, am spektakulärsten ist der „Viernes Espectacular“ am Freitagabend. Tickets gibt es vorab über Ticketmaster oder meist problemlos an der Abendkasse. Das Quartier Doctores ist nachts ungemütlich, nach der Show darum zügig ins Taxi oder Uber.",
   meta:"Dr. Lavista 189, Doctores · Di 19.30, Fr 20.30, So 17 Uhr", url:"https://cmll.com/arenas/arena-mexico/"},
  {cat:"alt", name:"Mercado de Jamaica", lat:19.408603, lng:-99.122704,
   note:"Der grosse Blumenmarkt der Stadt, rund um die Uhr offen, mit Bergen von Rosen und Sonnenblumen, Ofrenda-Schmuck und Gestecken aus tausenden Blüten. Die Halle von 1957 führt laut Stadtverwaltung rund 5000 Pflanzensorten, dazu klassische Marktgänge mit Essständen. Morgens ist der Farbrausch am üppigsten, vor Feiertagen wie dem Día de Muertos wird daraus ein Blütenmeer. Anreise direkt mit der Metro bis Station Jamaica, der Ausgang der Linie 9 liegt unmittelbar am Markt.",
   meta:"Guillermo Prieto 45, Colonia Jamaica · täglich 24 Std.", url:"https://mexicocity.cdmx.gob.mx/venues/jamaica-market/"},
  {cat:"alt", name:"La Ciudadela (Kunsthandwerk)", lat:19.430761, lng:-99.149161,
   note:"Kunsthandwerk-Markt mit rund 350 Ständen aus dem ganzen Land, Textilien, Keramik, Alebrijes, Silber und Flechtwerk, ideal für Mitbringsel. Angelegt wurde er im Vorfeld der Olympischen Spiele 1968, um Handwerk aus allen Bundesstaaten in der Hauptstadt zu zeigen. Die Preise sind fair und weitgehend fest, viel Ware kommt direkt aus den Werkstätten. Bar zahlen ist einfacher, nicht alle Stände nehmen Karten, und zuerst lohnt eine Orientierungsrunde durch die Gänge.",
   meta:"Balderas, Ecke Emilio Dondé, Centro · täglich ca. 10-19 Uhr, So bis 18 Uhr", url:"https://mexicocity.cdmx.gob.mx/venues/la-ciudadela-artisan-market/"},

  // ---------- Random Sights ----------
  {cat:"rnd", name:"Casa de los Azulejos", lat:19.434352, lng:-99.140123,
   note:"Stadtpalast der Grafen del Valle de Orizaba aus dem 18. Jahrhundert, aussen komplett mit blau-weissen Talavera-Kacheln aus Puebla verkleidet. Seit 1919 betreibt Sanborns hier Kaufhaus und Restaurant, gegessen wird im verglasten Säulenhof, einfach reinlaufen. Im Treppenhaus hängt ein Wandbild von José Clemente Orozco von 1925. Am ruhigsten ist es früh am Morgen, das Restaurant öffnet schon um 7 Uhr zum Frühstück.",
   meta:"Av. Francisco I. Madero 4, Centro Histórico · Restaurant täglich 7 bis 1 Uhr", url:"https://mexicocity.cdmx.gob.mx/venues/la-casa-de-los-azulejos/"},
  {cat:"rnd", name:"Torre Latinoamericana", lat:19.433866, lng:-99.140611,
   note:"Der 182 Meter hohe Wolkenkratzer von 1956 war ein Pionierbau auf dem weichen Seeboden der Stadt und überstand die schweren Erdbeben von 1957 und 1985 unbeschadet. Die Aussichtsplattform im 44. Stock bietet bei klarer Sicht Blick bis zu den Vulkanen Popocatépetl und Iztaccíhuatl. Am lohnendsten ist die Zeit kurz vor Sonnenuntergang, so sieht man Tageslicht und Lichtermeer in einem Besuch. Wer den Eintritt umgehen will, nimmt einen Kaffee im Restaurant Miralto im 41. Stock.",
   meta:"Eje Central Lázaro Cárdenas 2, Ecke Madero, Centro · täglich 9 bis 22 Uhr · Mirador ca. 220 MXN", url:"https://torrelatinoamericana.com.mx/"},
  {cat:"rnd", name:"Monumento a la Revolución", lat:19.436175, lng:-99.154621,
   note:"Der grösste Triumphbogen der Welt wurde unter Porfirio Díaz als Kuppelsaal eines riesigen Parlamentspalasts begonnen, die Revolution stoppte den Bau. 1938 formte Architekt Carlos Obregón Santacilia das übrig gebliebene Stahlskelett zum Revolutionsdenkmal um, in den Pfeilern liegen Helden wie Madero, Villa und Cárdenas begraben. Der gläserne Lift fährt zur Aussichtsterrasse unter der Kupferkuppel, oben führt eine Wendeltreppe bis in die Laterne. Am schönsten ist die Aussicht in der Dämmerung, freitags und samstags ist bis 22 Uhr offen.",
   meta:"Plaza de la República, Tabacalera · Mo bis Do 12 bis 20, Fr/Sa 12 bis 22, So 10 bis 20 Uhr · ca. 150 MXN", url:"https://www.mrm.mx/"},
  {cat:"rnd", name:"Mercado de Sonora", lat:19.422071, lng:-99.124688,
   note:"Der 1957 eröffnete „Hexenmarkt“ verkauft Heilkräuter, Amulette, Santa-Muerte-Figuren und Limpia-Reinigungsrituale zwischen Töpfen und Partyartikeln. Dazu kommen Keramik, Piñatas und ein umstrittener Gang mit lebenden Tieren, nichts für zarte Nasen. Wer eine Limpia ausprobieren will, fragt vorher nach dem Preis, die Kräuterrauch-Reinigung dauert nur Minuten und kostet wenig. Wertsachen zuhause lassen und Taschen vorne tragen, die Gegend ist ruppiger als das Zentrum.",
   meta:"Av. Fray Servando Teresa de Mier 419, Merced Balbuena · Mo bis Sa ca. 9 bis 18, So bis 17 Uhr", url:"https://mercadosonora.com.mx/"},
  {cat:"rnd", name:"Ángel de la Independencia", lat:19.427000, lng:-99.167669,
   note:"Die vergoldete Siegesgöttin kam 1910 zum hundertsten Jahrestag der Unabhängigkeit auf ihre 36 Meter hohe Säule. Im Sockel ruhen Gebeine von Unabhängigkeitshelden wie Hidalgo und Morelos, davor trifft sich die Stadt zu allem von Meisterfeiern bis Demos. Sonntagvormittags ist die Reforma autofrei und gehört Velos, Skates und Joggern. Mit einem Ecobici-Leihvelo lässt sich dann die ganze Prachtstrasse bis zum Chapultepec-Park abfahren.",
   meta:"Paseo de la Reforma, Col. Juárez · frei zugänglich · So ca. 8 bis 14 Uhr autofreie Reforma", url:"https://mexicocity.cdmx.gob.mx/venues/el-angel-independencia/"},
  {cat:"rnd", name:"Espacio Escultórico (UNAM)", lat:19.318546, lng:-99.182536,
   note:"Land-Art von 1979: sechs Künstler um Mathias Goeritz und Helen Escobedo legten einen Ring aus 64 Betonkeilen um ein schwarzes Lavafeld des Vulkans Xitle. Dahinter liegen Steppe, Vulkangestein und weitere Grossskulpturen im Naturreservat des UNESCO-gelisteten Universitätscampus. Der Ort ist karg, still und fotogen wie kaum ein anderer der Stadt. Der Zugang ist gratis, aber nur werktags von 7 bis 16 Uhr möglich, am einfachsten mit dem Metrobús bis Centro Cultural Universitario.",
   meta:"Circuito Mario de la Cueva, Ciudad Universitaria · Mo bis Fr 7 bis 16 Uhr · gratis", url:"https://mexicocity.cdmx.gob.mx/venues/unam-sculpture-space/"},
  {cat:"rnd", name:"Museo del Juguete Antiguo (MUJAM)", lat:19.415373, lng:-99.144101,
   note:"Die obsessive Privatsammlung des Architekten Roberto Shimizu zeigt über 40000 alte Spielsachen auf vier verstaubten Etagen: Lucha-Libre-Masken, Blechroboter, Puppen. Sortiert wird nach Sammlerlogik statt Museumsdidaktik, Wunderkammer statt Museum, genau das ist der Reiz. Das Haus im Quartier Doctores ist seit 2006 offen und tagsüber problemlos erreichbar, am bequemsten per Taxi-App. Achtung, am letzten Dienstag des Monats bleibt es geschlossen.",
   meta:"Dr. Olvera 15, Doctores · Mo bis Sa 9 bis 17, So 10 bis 17 Uhr · letzter Di im Monat zu", url:"https://www.museodeljuguete.com.mx/"},
  {cat:"rnd", name:"Kiosco Morisco", lat:19.449664, lng:-99.156855,
   note:"Der filigrane maurische Pavillon aus Gusseisen wurde von José Ramón Ibarrola für die Weltausstellung 1884/85 in New Orleans entworfen und in Pittsburgh gegossen. Nach Jahren in der Alameda Central steht er seit 1910 in der Alameda des Quartiers Santa María la Ribera. Sonntagnachmittags wird unter der Kuppel Danzón getanzt, Zuschauen ist ausdrücklich erwünscht. Gleich daneben lohnt das Geologiemuseum der UNAM mit seiner Jugendstil-Wendeltreppe.",
   meta:"Alameda de Santa María la Ribera · frei zugänglich · So Danzón", url:"https://mexicocity.cdmx.gob.mx/venues/kiosco-morisco/"},
  {cat:"rnd", name:"Plaza de las Tres Culturas", lat:19.451646, lng:-99.136205,
   note:"Drei Epochen auf einem Platz: die aztekischen Ruinen von Tlatelolco, die Kolonialkirche Santiago aus deren Steinen und die modernen Wohnblöcke der 1960er Jahre. Hier fiel 1521 die letzte Bastion der Azteken gegen Cortés, und am 2. Oktober 1968 schoss die Armee in die Menge der Studentenproteste. Ein Denkmal auf dem Platz erinnert an die Opfer, die Ruinenzone ist gratis und von Stegen aus gut überblickbar. Im Kulturzentrum CCU Tlatelolco nebenan vertieft das Memorial 68 die Geschichte des Massakers.",
   meta:"Eje Central Lázaro Cárdenas, Tlatelolco · Ruinenzone tagsüber · gratis", url:"https://mexicocity.cdmx.gob.mx/venues/plaza-de-las-tres-culturas/"},

  // ---------- Design & Architektur ----------
  {cat:"des", name:"Casa Estudio Diego Rivera y Frida Kahlo", lat:19.349560, lng:-99.197330,
   note:"Juan O'Gormans Doppel-Atelierhaus von 1932 gilt als eines der frühesten Manifeste der modernen Architektur Amerikas: zwei funktionalistische Kuben in Rot und Blau, über eine Dachbrücke verbunden und von einem Kakteenzaun gefasst. Der grosse rote Kubus war Riveras Atelier, der kleine blaue Fridas Haus, zum Ensemble gehört auch O'Gormans eigenes Wohnhaus von 1929, eines der ersten funktionalistischen Häuser Lateinamerikas. Seit 1986 ist die Anlage ein Museum des INBAL, Riveras Atelier ist samt Pinseln und riesigen Pappmaché-Figuren im Originalzustand erhalten. Sonntags ist der Eintritt gratis, ein Besuch lässt sich gut mit dem Samstagsmarkt Bazar Sábado in San Ángel kombinieren.",
   meta:"Diego Rivera / Ecke Altavista, San Ángel Inn · Di bis So 10 bis 17.30 Uhr · 50 MXN, So gratis", url:"https://estudiodiegorivera.inba.gob.mx/"},
  {cat:"des", name:"Casa Luis Barragán", lat:19.411122, lng:-99.192440,
   note:"Das Wohnhaus mit Atelier, das sich Luis Barragán 1948 baute, ist seit 2004 UNESCO-Welterbe: rosa Wände, präzis gelenktes Licht und gerahmte Gärten verdichten sich zum Schlüsselwerk seiner emotionalen Architektur. Barragán lebte hier bis zu seinem Tod 1988, das Haus ist nahezu unverändert erhalten. Der Besuch ist nur mit vorab online gebuchtem Ticket in kleinen Gruppen möglich, Termine sind oft Wochen im Voraus ausgebucht. Früh über casaluisbarragan.org reservieren und einplanen, dass Fotografieren im Innern nur mit separat bezahlter Erlaubnis gestattet ist.",
   meta:"General Francisco Ramírez 12, Ampliación Daniel Garza · nur mit vorab gebuchtem Ticket, Wochen im Voraus online reservieren · ca. 400 bis 600 MXN je nach Besuchsart", url:"https://www.casaluisbarragan.org/"},
  {cat:"des", name:"Biblioteca Vasconcelos", lat:19.447486, lng:-99.150807,
   note:"Alberto Kalachs „Megabiblioteca“ von 2006 ist ein gigantischer Stahlraum, in dem die Regale über sieben Ebenen frei zu schweben scheinen. Mittendrin hängt Gabriel Orozcos „Mátrix Móvil“, ein mit Grafitringen bemustertes Grauwal-Skelett. Umgeben ist der Bau von einem dichten botanischen Garten, der die Halle wie ein grüner Filter abschirmt. Eintritt und alle Angebote sind gratis, der beste Blick auf das Regalgebirge öffnet sich von den obersten Galerien.",
   meta:"Eje 1 Norte / Ecke Aldama, Buenavista · täglich 8.30 bis 19.30 Uhr · gratis", url:"https://bibliotecavasconcelos.gob.mx/"},
  {cat:"des", name:"Museo Soumaya", lat:19.440782, lng:-99.204566,
   note:"Der silbern schimmernde, fensterlose Turm von Fernando Romero (2011) ist mit rund 16000 Aluminium-Sechsecken verkleidet, gebaut von Carlos Slim zu Ehren seiner Frau Soumaya. Innen führt eine spiralförmige Rampe durch sechs Geschosse mit rund 66000 Werken, darunter eine der grössten Rodin-Sammlungen ausserhalb Frankreichs. Der Eintritt ist gratis, geöffnet ist täglich ohne Reservation. Am besten mit dem Lift zuoberst beginnen, wo die Rodin-Skulpturen unter dem Oberlicht stehen, und die Rampe hinuntergehen.",
   meta:"Blvd. Miguel de Cervantes Saavedra 303, Nuevo Polanco · täglich 10.30 bis 18.30 Uhr · gratis", url:"https://de.wikipedia.org/wiki/Museo_Soumaya"},
  {cat:"des", name:"Biblioteca Central (UNAM)", lat:19.333401, lng:-99.187331,
   note:"Den Bibliotheksturm von 1956 entwarf Juan O'Gorman zusammen mit Gustavo Saavedra und Juan Martínez de Velasco, alle vier Fassaden überzog er komplett mit Naturstein-Mosaiken. Das 4000 Quadratmeter grosse Bild „Representación Histórica de la Cultura“ erzählt die mexikanische Geschichte von der vorspanischen Zeit bis zur Moderne, ganz aus unbemalten, natürlich farbigen Steinen aus dem ganzen Land. Seit 2007 gehört der Bau mit dem zentralen Campus der Ciudad Universitaria zum UNESCO-Welterbe. Die Mosaike sind jederzeit von aussen frei zugänglich, lohnend in Kombination mit Siqueiros' Wandbildern an der Rektorei gleich nebenan.",
   meta:"Ciudad Universitaria, Coyoacán · Mosaike jederzeit von aussen, Bibliothek täglich 8.30 bis 21.30 Uhr · gratis", url:"https://es.wikipedia.org/wiki/Biblioteca_Central_(UNAM)"},
  {cat:"des", name:"Torres de Satélite", lat:19.499250, lng:-99.236861,
   note:"Die fünf farbigen Betonprismen von Luis Barragán und Mathias Goeritz, unter Mitwirkung des Malers Jesús Reyes Ferreira, wurden 1958 als Tor zur Trabantenstadt Ciudad Satélite eingeweiht. Mit 30 bis 52 Metern Höhe verschieben sie sich je nach Fahrtrichtung zu immer neuen Konstellationen, ein Hauptwerk der emotionalen Architektur. Sie stehen auf dem Mittelstreifen des Periférico Norte in Naucalpan und wirken am stärksten aus dem fahrenden Auto. Für einen kurzen Stopp lässt sich die Esplanade zu Fuss erreichen, am entspanntesten an verkehrsarmen Sonntagmorgen.",
   meta:"Periférico Norte (Blvd. Manuel Ávila Camacho), Ciudad Satélite, Naucalpan · frei zugänglich, im Vorbeifahren oder kurzer Stopp · gratis", url:"https://es.wikipedia.org/wiki/Torres_de_Sat%C3%A9lite"},
  {cat:"des", name:"Palacio Postal", lat:19.435663, lng:-99.140284,
   note:"Die Hauptpost von 1907 stammt von Adamo Boari, dem Architekten des Palacio de Bellas Artes schräg gegenüber, die moderne Stahlkonstruktion verantwortete der Ingenieur Gonzalo Garita. Der eklektische Bau mischt isabellinische Gotik mit Renaissance- und Jugendstilelementen, innen glänzen die goldene Doppeltreppe und Bronzearbeiten aus Florenz. Das Gebäude ist bis heute eine funktionierende Poststelle von Correos de México, im Obergeschoss liegt zudem ein kleines Postmuseum. Der Eintritt in die Halle ist frei, der beste Blick auf die Treppe öffnet sich gleich vom Eingang an der Ecke Tacuba und Eje Central.",
   meta:"Tacuba 1, Centro Histórico · Mo bis Fr ganztags, Sa vormittags · Eintritt frei", url:"https://es.wikipedia.org/wiki/Palacio_Postal"},
  {cat:"des", name:"Los Manantiales (Candela)", lat:19.248571, lng:-99.092857,
   note:"Félix Candelas Meisterwerk von 1958: eine achteckige Betonschale aus vier gekreuzten Hypar-Flächen, nur wenige Zentimeter dünn, direkt am Kanal von Xochimilco. Weil die doppelt gekrümmte Schale ihre Lasten als reine Membrankräfte ableitet, kommt der weite Innenraum ganz ohne Stützen aus. Nach den Erdbebenschäden von 2017 haben die Architekturfakultät der UNAM und der Bezirk Xochimilco den Bau restauriert, seit Anfang 2025 ist er gesichert und soll als öffentlicher Kulturort weiterleben. Am schönsten zeigt sich die Schale vom Wasser aus, also eine Trajinera am Embarcadero Las Flores Nativitas oder Zacapa nehmen, beide liegen direkt daneben.",
   meta:"Calz. Xochimilco-Tulyehualco 60, Santa María Nativitas, Xochimilco · per Trajinera ab Embarcadero Las Flores/Zacapa, aussen frei einsehbar", url:"https://mexicocity.cdmx.gob.mx/venues/manantieles-xochimilco-ruin/"},
  {cat:"des", name:"Palacio de los Deportes", lat:19.405280, lng:-99.099720,
   note:"Candelas Arena für die Olympischen Spiele 1968, entworfen mit Enrique Castañeda und Antonio Peyri: eine gewaltige Kuppel über quadratischem Grundriss. Statt Beton spannte Candela hier Hypar-Felder aus kupferbeschlagenem Holz über ein Netz sich kreuzender Stahlgitterbögen, das Kupfer ist längst türkis angelaufen und prägt die Skyline im Osten der Stadt. Heute dient der Bau als eine der grossen Konzert- und Eventhallen der Stadt mit Platz für rund 20'000 Personen. Ins Innere kommt man nur mit Eventticket, der beste Blick auf die Kuppel bietet sich beim Zugang von der Metrostation Velódromo (Linie 9).",
   meta:"Av. Río Churubusco, Ciudad Deportiva Magdalena Mixhuca · Metro Velódromo · innen nur bei Events (Tickets), aussen jederzeit", url:"https://www.palaciodelosdeportes.mx/"},
  {cat:"des", name:"Iglesia de la Medalla Milagrosa", lat:19.379500, lng:-99.157300,
   note:"Candelas gefaltete Kirche von 1955: schräge Beton-Hypars, die Pfeiler und Gewölbe zugleich sind, innen wirkt der Raum wie ein expressionistischer Kristall. Der Bau war sein Labor für die Hypar-Geometrie, weil sich die doppelt gekrümmten Flächen selbst aussteifen, kommen die gefalteten Wände mit wenigen Zentimetern Beton aus. So bewies er, dass dünne Schalen nicht nur Fabrikdächer, sondern auch Sakralbau können. Täglich geöffnet und gratis, am eindrücklichsten am Vormittag ausserhalb der Messen, wenn Licht durch die farbigen Fenster fällt.",
   meta:"Matías Romero 78, Vértiz Narvarte · täglich offen, mehrere Messen pro Tag · Eintritt frei", url:"https://en.wikipedia.org/wiki/Iglesia_de_la_Medalla_de_la_Virgen_Milagrosa"},
  {cat:"des", name:"Pabellón de Rayos Cósmicos (UNAM)", lat:19.333953, lng:-99.181247,
   note:"Nur 15 Millimeter dünn: das Dach des Pavillons von 1951, mit dem Candela zusammen mit Jorge González Reyna auf dem UNAM-Campus seine erste Hypar-Schale baute. Die Decke musste so dünn sein, damit die kosmische Strahlung zu den Messgeräten durchdringen konnte, erst die doppelt gekrümmte Hypar-Geometrie machte das statisch möglich. Von diesem unscheinbaren Experiment führt eine direkte Linie zu allen späteren Schalenbauten Candelas, wegen seiner Form heisst der Bau auf dem Campus „La Muela“, der Backenzahn. Er steht zwischen den Fakultäten für Medizin und Zahnmedizin im UNESCO-geschützten Campusteil, der frei zugänglich ist, der Blick von aussen genügt.",

// ---------- Karte ----------
const map = L.map('map', {zoomControl:true}).setView([19.39, -99.15], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19
}).addTo(map);

const markers = [];
PLACES.forEach(p => {
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin ${p.cat}">${CATS[p.cat].emoji}</div>`,
    iconSize:[38,38], iconAnchor:[19,36]
  });
  const m = L.marker([p.lat, p.lng], {icon}).addTo(map);
  m.on('click', () => openSheet(p));
  m._cat = p.cat;
  markers.push(m);
});

// ---------- Bottom Sheet ----------
const sheet = document.getElementById('sheet');
function openSheet(p){
  document.getElementById('sheetTag').textContent = CATS[p.cat].emoji + ' ' + CATS[p.cat].label;
  document.getElementById('sheetTag').className = 'tag ' + p.cat;
  document.getElementById('sheetTag').style.background = '';
  document.getElementById('sheetRoute').style.display = '';
  document.getElementById('sheetTitle').textContent = p.name;
  document.getElementById('sheetNote').textContent = p.note;
  document.getElementById('sheetMeta').textContent = p.meta || '';
  document.getElementById('sheetRoute').href =
    'https://www.google.com/maps/dir/?api=1&destination=' + p.lat + ',' + p.lng;
  const web = document.getElementById('sheetWeb');
  if(p.url){ web.href = p.url; web.style.display = ''; }
  else { web.style.display = 'none'; }
  const del = document.getElementById('sheetDel');
  if(p.cat === 'own'){
    del.style.display = '';
    del.onclick = () => removeOwnPin(p);
  } else {
    del.style.display = 'none';
  }
  sheet.classList.add('open');
  map.panTo([p.lat, p.lng], {animate:true});
}
map.on('click', () => sheet.classList.remove('open'));

// Swipe nach unten schliesst das Sheet
let startY = null;
sheet.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive:true});
sheet.addEventListener('touchmove', e => {
  if(startY !== null && e.touches[0].clientY - startY > 60){
    sheet.classList.remove('open'); startY = null;
  }
}, {passive:true});

// ---------- Filter ----------
const state = {};
Object.keys(CATS).forEach(k => state[k] = true);
const allOn = () => Object.keys(CATS).every(k => state[k]);
function applyFilter(){
  markers.forEach(m => {
    if(m._cat === 'own') return; // eigene Pins sind immer sichtbar
    if(state[m._cat]) m.addTo(map); else map.removeLayer(m);
  });
  document.querySelectorAll('.chip').forEach(c => {
    const cat = c.dataset.cat;
    if(cat === 'safety') return; // Overlay-Toggle, kein Kategorie-Filter
    if(cat === 'all'){
      c.classList.toggle('off', !allOn());
    } else {
      c.classList.toggle('off', !state[cat]);
    }
  });
}
document.getElementById('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const cat = chip.dataset.cat;
  if(cat === 'safety'){ toggleSafety(); return; }
  if(cat === 'all'){
    Object.keys(CATS).forEach(k => state[k] = true);
  } else {
    // Wenn aktuell alle an sind: nur diese Kategorie zeigen
    if(allOn()){
      Object.keys(CATS).forEach(k => state[k] = false);
      state[cat] = true;
    } else {
      state[cat] = !state[cat];
      if(Object.keys(CATS).every(k => !state[k])){
        Object.keys(CATS).forEach(k => state[k] = true);
      }
    }
  }
  applyFilter();
  sheet.classList.remove('open');
});
applyFilter();

// ---------- Eigene Pins (nur auf diesem Gerät, localStorage) ----------
// Long-Press (mobil) bzw. Rechtsklick (Desktop) auf die Karte legt einen Pin an.
const OWN_KEY = 'mexOwnPins';
let ownPins = [];
try { ownPins = JSON.parse(localStorage.getItem(OWN_KEY) || '[]'); } catch(e){ ownPins = []; }
function saveOwnPins(){ localStorage.setItem(OWN_KEY, JSON.stringify(ownPins)); }

function addOwnMarker(p){
  const icon = L.divIcon({
    className:'',
    html:`<div class="pin own">${CATS.own.emoji}</div>`,
    iconSize:[38,38], iconAnchor:[19,36]
  });
  const m = L.marker([p.lat, p.lng], {icon}).addTo(map);
  m.on('click', () => openSheet(p));
  m._cat = 'own';
  m._p = p;
  markers.push(m);
}
ownPins.forEach(addOwnMarker);

function removeOwnPin(p){
  if(!confirm('Diesen eigenen Pin löschen?')) return;
  ownPins = ownPins.filter(x => x !== p);
  saveOwnPins();
  const i = markers.findIndex(m => m._p === p);
  if(i > -1){ map.removeLayer(markers[i]); markers.splice(i, 1); }
  sheet.classList.remove('open');
}

map.on('contextmenu', e => {
  const name = prompt('Neuer eigener Pin - Name:');
  if(!name) return;
  const note = prompt('Notiz (optional):') || '';
  const p = {
    cat:'own', name:name.trim(), note:note.trim(),
    meta:'Eigener Pin · nur auf diesem Gerät gespeichert',
    lat:+e.latlng.lat.toFixed(6), lng:+e.latlng.lng.toFixed(6)
  };
  ownPins.push(p); saveOwnPins(); addOwnMarker(p); openSheet(p);
});

,"h":10,"rc":95,"rs":129,"mc":0,"ms":14},"TLATELOLCO":{"p":96558,"h":16,"rc":56,"rs":6,"mc":0,"ms":6},"TOPILEJO":{"p":151470,"h":22,"rc":47,"rs":5,"mc":0,"ms":0},"UNIVERSIDAD":{"p":129324,"h":6,"rc":68,"rs":43,"mc":0,"ms":22},"XOTEPINGO":{"p":161720,"h":4,"rc":78,"rs":27,"mc":0,"ms":0},"ZAPOTITLA":{"p":197512,"h":15,"rc":93,"rs":18,"mc":0,"ms":11},"ZARAGOZA":{"p":36404,"h":2,"rc":30,"rs":6,"mc":0,"ms":6}};
const SEC_PERIOD = "Jun 2025 - Mai 2026";

const SEC_COLORS = ['#ffffb2','#fecc5c','#fd8d3c','#f03b20','#bd0026'];
const SEC_METRICS = {
  hom:{rate:d => d.h/d.p*1e5},
  rob:{rate:d => d.rc/d.p*1e5}
};
let secMetric = 'hom', secLayer = null, secBreaks = [], safetyOn = false;

function secTitle(s){
  return s.toLowerCase().replace(/(^|[ \-\/])([a-zà-ú])/g, (m,a,b) => a + b.toUpperCase());
}
function secCalcBreaks(){
  const rates = Object.values(SEC_DATA).map(SEC_METRICS[secMetric].rate).sort((a,b) => a-b);
  secBreaks = [1,2,3,4].map(i => rates[Math.floor(rates.length*i/5)]);
}
function secColor(rate){
  let i = 0;
  while(i < 4 && rate >= secBreaks[i]) i++;
  return SEC_COLORS[i];
}
function secStyle(f){
  const d = SEC_DATA[f.properties.s];
  return {color:'#fff', weight:1, opacity:.7,
          fillColor:secColor(SEC_METRICS[secMetric].rate(d)), fillOpacity:.5};
}

function openSectorSheet(name){
  const d = SEC_DATA[name];
  const tag = document.getElementById('sheetTag');
  tag.textContent = '🚨 Sicherheitslage';
  tag.className = 'tag';
  tag.style.background = '#b3261e';
  document.getElementById('sheetTitle').textContent = 'Sektor ' + secTitle(name);
  const f = n => (n/d.p*1e5).toLocaleString('de-CH', {maximumFractionDigits:1});
  document.getElementById('sheetNote').innerHTML =
    'Fälle pro 100’000 Einwohner und Jahr:<br>' +
    '· Tötungsdelikte: <b>' + f(d.h) + '</b> (' + d.h + ' Fälle)<br>' +
    '· Strassenraub mit Gewalt: <b>' + f(d.rc) + '</b> (' + d.rc + ')<br>' +
    '· Strassenraub ohne Gewalt: <b>' + f(d.rs) + '</b> (' + d.rs + ')<br>' +
    '· Raub in der Metro: <b>' + f(d.mc + d.ms) + '</b> (' + (d.mc + d.ms) + ')';
  document.getElementById('sheetMeta').textContent =
    SEC_PERIOD + ' · ' + d.p.toLocaleString('de-CH') +
    ' Einwohner · Quelle: hoyodecrimen.com / Open Data CDMX';
  document.getElementById('sheetRoute').style.display = 'none';
  document.getElementById('sheetWeb').style.display = 'none';
  document.getElementById('sheetDel').style.display = 'none';
  sheet.classList.add('open');
}

function secRenderLegend(){
  const rates = Object.values(SEC_DATA).map(SEC_METRICS[secMetric].rate);
  const max = Math.max(...rates);
  const bounds = [0, ...secBreaks, max];
  document.getElementById('secScale').innerHTML = SEC_COLORS.map((c,i) =>
    '<span style="background:' + c + '" title="' + bounds[i].toFixed(0) + ' bis ' +
    bounds[i+1].toFixed(0) + ' pro 100’000"></span>').join('');
  document.getElementById('secHi').textContent = Math.round(max).toLocaleString('de-CH');
  document.getElementById('secMetH').classList.toggle('on', secMetric === 'hom');
  document.getElementById('secMetR').classList.toggle('on', secMetric === 'rob');
}

function secBuildLayer(){
  if(secLayer) map.removeLayer(secLayer);
  secCalcBreaks();
  secLayer = L.geoJSON(SEC_GEO, {
    style: secStyle,
    onEachFeature: (feat, layer) => {
      layer.options.bubblingMouseEvents = false; // sonst schliesst der map-click das Sheet gleich wieder
      layer.on('click', () => openSectorSheet(feat.properties.s));
    }
  }).addTo(map);
  secRenderLegend();
}

function toggleSafety(){
  safetyOn = !safetyOn;
  document.getElementById('safetyChip').classList.toggle('on', safetyOn);
  document.getElementById('secLegend').classList.toggle('show', safetyOn);
  if(safetyOn){
    secBuildLayer();
  } else {
    if(secLayer){ map.removeLayer(secLayer); secLayer = null; }
    sheet.classList.remove('open');
  }
}
document.getElementById('secMetH').addEventListener('click', () => { secMetric = 'hom'; secBuildLayer(); });
document.getElementById('secMetR').addEventListener('click', () => { secMetric = 'rob'; secBuildLayer(); });

// ---------- Eigener Standort ----------
const locateBtn = document.getElementById('locateBtn');
let watchId = null, meMarker = null, meCircle = null, firstFix = true;

const meIcon = L.divIcon({
  className:'',
  html:'<div class="me-rose"><div class="me-beam"></div><div class="me-dot me-pulse"></div></div>',
  iconSize:[48,48], iconAnchor:[24,24]
});

// Blickrichtung: Kompass (deviceorientation) mit GPS-Kurs als Fallback
let meHeading = null, compassStarted = false;
let beamDeg = null; // kontinuierlicher Winkel (ohne Modulo), damit 359°→1° nicht rückwärts dreht
function setBeam(deg){
  if(!meMarker) return;
  const el = meMarker.getElement() && meMarker.getElement().querySelector('.me-beam');
  if(el){ el.style.display = 'block'; el.style.transform = 'rotate(' + deg + 'deg)'; }
}
function smoothBeam(target){
  if(beamDeg === null){ beamDeg = target; setBeam(beamDeg); return; }
  // kürzeste Winkeldifferenz, Totzone gegen Sensor-Zittern, sanft nachziehen
  const d = ((target - (beamDeg % 360) + 540) % 360) - 180;
  if(Math.abs(d) < 2) return;
  beamDeg += d * 0.2;
  setBeam(beamDeg);
}
function onOrient(e){
  let h = null;
  if(typeof e.webkitCompassHeading === 'number') h = e.webkitCompassHeading; // iOS
  else if(e.absolute && typeof e.alpha === 'number') h = 360 - e.alpha;      // Android
  if(h !== null && !isNaN(h)){ meHeading = h; smoothBeam(h); }
}
function startCompass(){
  if(compassStarted) return;
  compassStarted = true;
  if(typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
    // iOS verlangt eine Nutzer-Geste; Aufruf kommt aus dem Button-Klick
    DeviceOrientationEvent.requestPermission()
      .then(s => { if(s === 'granted') window.addEventListener('deviceorientation', onOrient); })
      .catch(() => {});
  } else {
    window.addEventListener('deviceorientationabsolute', onOrient);
    window.addEventListener('deviceorientation', onOrient);
  }
}

function onFix(pos){
  const ll = [pos.coords.latitude, pos.coords.longitude];
  if(!meMarker){
    meMarker = L.marker(ll, {icon:meIcon, zIndexOffset:1000, interactive:false}).addTo(map);
    if(meHeading !== null) setBeam(meHeading);
    meCircle = L.circle(ll, {
      radius:pos.coords.accuracy,
      color:'#1a73e8', weight:1, opacity:.4,
      fillColor:'#1a73e8', fillOpacity:.1, interactive:false
    }).addTo(map);
  } else {
    meMarker.setLatLng(ll);
    meCircle.setLatLng(ll).setRadius(pos.coords.accuracy);
  }
  // Ohne Kompass-Daten: Bewegungsrichtung aus dem GPS übernehmen
  if(meHeading === null && typeof pos.coords.heading === 'number' &&
     !isNaN(pos.coords.heading) && pos.coords.speed > 0.5){
    smoothBeam(pos.coords.heading);
  }
  if(firstFix){
    map.setView(ll, Math.max(map.getZoom(), 14), {animate:true});
    firstFix = false;
  }
}

function onErr(err){
  stopLocate();
  alert('Standort nicht verfügbar. Bitte Ortungsdienste erlauben (funktioniert nur über HTTPS).');
}

function startLocate(){
  if(!('geolocation' in navigator)){ alert('Dieses Gerät unterstützt keine Ortung.'); return; }
  firstFix = true;
  watchId = navigator.geolocation.watchPosition(onFix, onErr, {
    enableHighAccuracy:true, maximumAge:10000, timeout:15000
  });
  locateBtn.classList.add('active');
}

function stopLocate(){
  if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
  if(meMarker){ map.removeLayer(meMarker); meMarker = null; }
  if(meCircle){ map.removeLayer(meCircle); meCircle = null; }
  locateBtn.classList.remove('active');
}

locateBtn.addEventListener('click', () => {
  startCompass(); // Nutzer-Geste, nötig für die iOS-Kompass-Erlaubnis
  if(watchId !== null){
    if(meMarker) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 15), {animate:true});
    else stopLocate();
  } else {
    startLocate();
  }
});
locateBtn.addEventListener('dblclick', stopLocate);

// Beim Laden automatisch versuchen (Browser fragt nach Erlaubnis)
startLocate();

// Kompass so früh wie möglich: ohne Permission-API (Android/Desktop) sofort,
// mit Permission-API (iOS) beim ERSTEN Tippen irgendwo auf der Seite
if(typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission){
  document.addEventListener('click', startCompass, {once:true});
  document.addEventListener('touchend', startCompass, {once:true});
} else {
  startCompass();
}
</script>
